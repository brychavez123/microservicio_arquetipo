#set( $dollar = '$' )
spring.application.name=${artifactId}
server.port=${dollar}{PORT:${puerto}}

# Credenciales en db.properties (no se sube a Git) o en variables de entorno (Docker)
spring.config.import=optional:file:./db.properties

# Oracle Cloud (Autonomous Database) con Wallet
spring.datasource.url=jdbc:oracle:thin:@${dollar}{DB_TNS_NAME}?TNS_ADMIN=${dollar}{DB_WALLET_PATH}
spring.datasource.username=${dollar}{DB_USERNAME:ADMIN}
spring.datasource.password=${dollar}{DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas se crean con los scripts de la carpeta db/
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Origenes permitidos por CORS (separados por coma)
app.cors.origenes=${dollar}{CORS_ORIGENES:http://localhost:4200,http://localhost:8080}

# Logging
logging.level.root=INFO
logging.level.com.duoc=DEBUG

management.endpoints.web.exposure.include=health,info
